[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "saps-search"
version = "0.1.0"
description = "Read-only client and edification searches for authorized SAPS users"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1.0",
  "beautifulsoup4>=4.12,<5.0",
]

[project.scripts]
saps-search = "saps_search.cli:main"

[tool.setuptools.packages.find]
include = ["saps_search*"]
